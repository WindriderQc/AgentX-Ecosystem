name: publish-product-images

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [core, benchmark, rag]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and channel tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/windriderqc/agentx-${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=https://github.com/WindriderQc/AgentX-Ecosystem
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=test,enable=${{ github.event_name != 'release' || github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
