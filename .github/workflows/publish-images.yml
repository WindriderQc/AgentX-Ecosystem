name: publish-product-images

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify tag, service versions, lockfiles, and release notes
        env:
          AGENTX_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: node scripts/verify-release-contract.js

  publish:
    needs: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [core, benchmark, rag]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and channel tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/windriderqc/agentx-${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=https://github.com/WindriderQc/AgentX-Ecosystem
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=test,enable=${{ github.event_name != 'release' || github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Record immutable release image
        if: github.event_name == 'release'
        env:
          RELEASE_SERVICE: ${{ matrix.service }}
          RELEASE_IMAGE: ghcr.io/windriderqc/agentx-${{ matrix.service }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release-receipts
          node -e "const fs=require('fs'); const receipt={schemaVersion:1,service:process.env.RELEASE_SERVICE,image:process.env.RELEASE_IMAGE,digest:process.env.RELEASE_DIGEST,tag:process.env.RELEASE_TAG,commit:process.env.RELEASE_COMMIT}; fs.writeFileSync('release-receipts/'+receipt.service+'.json',JSON.stringify(receipt,null,2)+'\n');"

      - name: Preserve immutable release image receipt
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ matrix.service }}
          path: release-receipts/${{ matrix.service }}.json
          if-no-files-found: error

  release-record:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-image-*
          path: release-receipts
          merge-multiple: true
      - name: Assemble and validate the release image manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/assemble-release-image-manifest.js \
            --receipts release-receipts \
            --output "agentx-${RELEASE_TAG}-images.json" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"
      - name: Attach immutable image manifest to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "agentx-${RELEASE_TAG}-images.json" --clobber
