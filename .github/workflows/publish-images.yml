name: publish-product-images

# Builds the three product images for a main commit once product-ci is green
# and pushes them to GHCR as ghcr.io/windriderqc/agentx-<service>:sha-<commit>
# (plus :latest). The digests printed in the job summary are what AIOps pins.

on:
  workflow_run:
    workflows: [product-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character main commit to build (defaults to the branch head)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [core, benchmark, rag]
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$EVENT_SHA}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit: $sha" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/windriderqc/agentx-${{ matrix.service }}:sha-${{ steps.source.outputs.sha }}
            ghcr.io/windriderqc/agentx-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/WindriderQc/AgentX-Ecosystem
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            AGENTX_BUILD_REVISION=${{ steps.source.outputs.sha }}
      - name: Summary
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ steps.source.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### agentx-$SERVICE"
            echo
            echo '```'
            echo "AGENTX_PRODUCT_COMMIT=$SHA"
            echo "AGENTX_$(echo "$SERVICE" | tr a-z A-Z)_IMAGE=ghcr.io/windriderqc/agentx-$SERVICE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
