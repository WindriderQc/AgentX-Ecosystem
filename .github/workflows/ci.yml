name: product-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [core, benchmark, rag]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm run build --if-present
        working-directory: ${{ matrix.service }}
      - run: npm test -- --runInBand
        working-directory: ${{ matrix.service }}

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scripts parse
        run: |
          bash -n agentx
          node --check core/server.js
          node --check benchmark/server.js
          node --check rag/server.js
      - name: Compose renders
        run: |
          AGENTX_BUILD_REVISION=ci docker compose --env-file config/agentx.env -f docker-compose.yml config --quiet
          AGENTX_BUILD_REVISION=ci docker compose --env-file config/agentx.env -f docker-compose.yml -f docker-compose.ollama.yml --profile ollama config --quiet
