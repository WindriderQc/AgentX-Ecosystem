name: product-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
        working-directory: core
      - run: npm audit --audit-level=high
        working-directory: core
      - run: npm run build
        working-directory: core
      - name: Validate all Core contracts
        run: npm test -- --runInBand
        working-directory: core

  benchmark-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: benchmark/package-lock.json
      - run: npm ci
        working-directory: benchmark
      - run: npm audit --audit-level=high
        working-directory: benchmark
      - name: Validate all Benchmark contracts
        run: npm test -- --runInBand
        working-directory: benchmark

  rag-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rag/package-lock.json
      - run: npm ci
        working-directory: rag
      - run: npm audit --audit-level=high
        working-directory: rag
      - name: Validate all RAG contracts
        run: npm test -- --runInBand
        working-directory: rag

  compose-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate release version contract
        run: |
          node --test scripts/verify-release-contract.test.js scripts/assemble-release-image-manifest.test.js
          node scripts/verify-release-contract.js
      - name: Validate command scripts
        run: |
          bash -n agentx
          node --check core/server.js
          node --check benchmark/server.js
          node --check rag/server.js
          node --check skills/obsidian-open-formats/scripts/validate.js
      - name: Validate portable Obsidian skill
        run: |
          node --test skills/obsidian-open-formats/scripts/validate.test.js
          node skills/obsidian-open-formats/scripts/validate.js \
            skills/obsidian-open-formats/SKILL.md \
            skills/obsidian-open-formats/references/markdown.md \
            skills/obsidian-open-formats/references/json-canvas.md \
            skills/obsidian-open-formats/references/sources.md
      - name: Render default and Ollama Compose profiles
        run: |
          docker compose --env-file config/agentx.env -f docker-compose.yml config --format json > /tmp/agentx-base.json
          docker compose --env-file config/agentx.env -f docker-compose.yml -f docker-compose.ollama.yml --profile ollama config --format json > /tmp/agentx-ollama.json
          node <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('/tmp/agentx-base.json', 'utf8'));
          const overlay = JSON.parse(fs.readFileSync('/tmp/agentx-ollama.json', 'utf8'));
          const names = value => Object.keys(value.services).sort().join(',');
          if (names(base) !== 'benchmark,core,mongo,qdrant,rag') throw new Error(`Unexpected default services: ${names(base)}`);
          if (names(overlay) !== 'benchmark,core,mongo,ollama,qdrant,rag') throw new Error(`Unexpected Ollama services: ${names(overlay)}`);
          for (const name of ['core', 'benchmark', 'rag']) {
            if (base.services[name].environment.AGENTX_PROFILE !== 'demo') throw new Error(`${name} is not in demo profile`);
            for (const port of base.services[name].ports || []) {
              if (port.host_ip !== '127.0.0.1') throw new Error(`${name} is not bound to loopback`);
            }
            if (!base.services[name].healthcheck.test.at(-1).includes('statusCode===200')) {
              throw new Error(`${name} health check does not require HTTP 200`);
            }
          }
          if (Object.hasOwn(base.services.core.environment, 'AGENTX_EXTENSION_MODULES')) {
            throw new Error('Default Core Compose must not configure trusted extensions');
          }
          for (const service of Object.values(base.services)) {
            if ((service.volumes || []).some(volume => volume.type === 'bind')) throw new Error('Default Compose contains a bind mount');
          }
          const rendered = JSON.stringify({ base, overlay });
          if (/aiops|obsidian|openclaw|hermes|octoprint|specialblend|192\.168\.|10\.0\.0\.99/i.test(rendered)) {
            throw new Error('Rendered Compose contains a forbidden environment marker');
          }
          NODE

  clean-first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate the clean-first-run verifier
        run: node --test scripts/verify-clean-first-run.test.js
      - name: Follow the documented Linux first run
        run: |
          chmod +x agentx
          ./agentx doctor
          ./agentx up
          ./agentx health
      - name: Verify the running standalone demo
        run: |
          node scripts/verify-clean-first-run.js
          docker container inspect agentx-ecosystem-core agentx-ecosystem-benchmark > /tmp/agentx-first-run-containers.json
          node <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/agentx-first-run-containers.json', 'utf8'));
          const byName = Object.fromEntries(rows.map(row => [String(row.Name || '').replace(/^\//, ''), row]));
          const environment = name => Object.fromEntries((byName[name]?.Config?.Env || []).map(value => {
            const separator = value.indexOf('=');
            return [value.slice(0, separator), value.slice(separator + 1)];
          }));
          const core = environment('agentx-ecosystem-core');
          const benchmark = environment('agentx-ecosystem-benchmark');
          if (core.AGENTX_PROFILE !== 'demo' || benchmark.AGENTX_PROFILE !== 'demo') {
            throw new Error('Clean first run did not keep Product services in the demo profile');
          }
          if (Object.hasOwn(core, 'AGENTX_EXTENSION_MODULES')) {
            throw new Error('Clean first run loaded a trusted extension');
          }
          if (!/^[a-f0-9]{64}$/.test(core.AGENTX_BENCHMARK_TOKEN || '')
              || core.AGENTX_BENCHMARK_TOKEN !== benchmark.AGENTX_BENCHMARK_TOKEN) {
            throw new Error('Launchers did not provide one ephemeral Benchmark credential');
          }
          NODE
          if docker container inspect agentx-ecosystem-ollama >/dev/null 2>&1; then
            echo "Clean first run unexpectedly created the optional Ollama container" >&2
            exit 1
          fi
      - name: Show bounded service status on failure
        if: failure()
        run: ./agentx status || true
      - name: Remove first-run containers, network, and volumes
        if: always()
        run: |
          ./agentx down --volumes --remove-orphans
          for container in \
            agentx-ecosystem-mongo \
            agentx-ecosystem-qdrant \
            agentx-ecosystem-core \
            agentx-ecosystem-benchmark \
            agentx-ecosystem-rag \
            agentx-ecosystem-ollama; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              echo "Cleanup left container: $container" >&2
              exit 1
            fi
          done
          for volume in \
            agentx_ecosystem_mongo_data \
            agentx_ecosystem_qdrant_data \
            agentx_ecosystem_core_logs \
            agentx_ecosystem_benchmark_config \
            agentx_ecosystem_benchmark_logs \
            agentx_ecosystem_rag_logs \
            agentx_ecosystem_ollama_data; do
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "Cleanup left volume: $volume" >&2
              exit 1
            fi
          done
          if docker network inspect agentx-ecosystem_default >/dev/null 2>&1; then
            echo "Cleanup left network: agentx-ecosystem_default" >&2
            exit 1
          fi

  image-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [core, benchmark, rag]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.service }} image without publishing
        run: docker build --file docker/${{ matrix.service }}.Dockerfile --tag agentx-${{ matrix.service }}:ci .
      - name: Verify Benchmark operator scripts are packaged and default offline
        if: matrix.service == 'benchmark'
        run: |
          docker run --rm --entrypoint test agentx-benchmark:ci \
            -f /app/scripts/migrate-exact-artifact-profile-indexes.js
          docker run --rm --entrypoint test agentx-benchmark:ci \
            -f /app/scripts/cloud-lane-campaign.js
          docker run --rm --entrypoint node agentx-benchmark:ci \
            scripts/cloud-lane-campaign.js \
            --campaign data/cloud-lane-campaign.example.json \
            --fixtures data/cloud-lane-campaign-fixtures.example.json \
            | grep -F '"networkCalls": 0'
