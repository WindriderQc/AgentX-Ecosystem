name: agentx-ecosystem

services:
  mongo:
    image: mongo:7
    container_name: agentx-ecosystem-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentx-ecosystem-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    container_name: agentx-ecosystem-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_PORT:-3180}:3080"
    environment:
      NODE_ENV: production
      PORT: 3080
      AGENTX_PROFILE: demo
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: ${AGENTX_OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_HOST_NAME: ${OLLAMA_HOST_NAME:-Local Ollama}
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agentx_product_embeddings
      BENCHMARK_SERVICE_URL: http://benchmark:3081
      RAG_SERVICE_URL: http://rag:3082
      CORE_PUBLIC_URL: http://localhost:${CORE_PORT:-3180}
      BENCHMARK_PUBLIC_URL: http://localhost:${BENCHMARK_PORT:-3181}
      RAG_PUBLIC_URL: http://localhost:${RAG_PORT:-3182}
      OPENROUTER_API_KEY: ""
      OPENROUTER_MANAGEMENT_KEY: ""
      PERPLEXITY_API_KEY: ""
      BRAVE_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      AGENTX_OPERATOR_TOKEN: ""
      AGENTX_MCP_TOKEN: ""
      AGENTX_CODEX_USAGE_TOKEN: ""
      AGENTX_ENABLE_LEGACY_BUDDY_API: "false"
      ALERT_TELEGRAM_ENABLED: "false"
      ALERT_TELEGRAM_BOT_TOKEN: ""
      ALERT_TELEGRAM_CHAT_ID: ""
      BACKUP_SCHEDULE_ENABLED: "false"
      MEMORY_REVIEW_MODE: shadow
      LEANTIME_API_KEY: ""
      LEANTIME_BASE_URL: ""
      VOIX_BASE_URL: ""
      CORS_ORIGINS: http://localhost:${CORE_PORT:-3180},http://127.0.0.1:${CORE_PORT:-3180},http://localhost:${BENCHMARK_PORT:-3181},http://127.0.0.1:${BENCHMARK_PORT:-3181},http://localhost:${RAG_PORT:-3182},http://127.0.0.1:${RAG_PORT:-3182}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - core_logs:/app/logs

  benchmark:
    build:
      context: .
      dockerfile: docker/benchmark.Dockerfile
    container_name: agentx-ecosystem-benchmark
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BENCHMARK_PORT:-3181}:3081"
    environment:
      NODE_ENV: production
      PORT: 3081
      AGENTX_PROFILE: demo
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: ${AGENTX_OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_HOST_NAME: ${OLLAMA_HOST_NAME:-Local Ollama}
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      CORE_URL: http://core:3080
      CORE_PUBLIC_URL: http://localhost:${CORE_PORT:-3180}
      BUDDY_EMIT_TOKEN: ""
      CORS_ORIGINS: http://localhost:${CORE_PORT:-3180},http://127.0.0.1:${CORE_PORT:-3180},http://localhost:${BENCHMARK_PORT:-3181},http://127.0.0.1:${BENCHMARK_PORT:-3181}
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - benchmark_config:/app/config-data
      - benchmark_logs:/app/logs

  rag:
    build:
      context: .
      dockerfile: docker/rag.Dockerfile
    container_name: agentx-ecosystem-rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_PORT:-3182}:3082"
    environment:
      NODE_ENV: production
      PORT: 3082
      HOST: 0.0.0.0
      AGENTX_PROFILE: demo
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      VECTOR_STORE_TYPE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agentx_product_embeddings
      EMBEDDING_PROVIDER: core-proxy
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      CORE_PROXY_URL: http://core:3080
      CORE_URL: http://core:3080
      BUDDY_EMIT_TOKEN: ""
      RAG_INGESTION_POLICY_PATH: /config/rag-ingestion-policy.json
      CORS_ORIGINS: http://localhost:${CORE_PORT:-3180},http://127.0.0.1:${CORE_PORT:-3180},http://localhost:${RAG_PORT:-3182},http://127.0.0.1:${RAG_PORT:-3182}
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3082/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - rag_logs:/app/logs

volumes:
  mongo_data:
    name: agentx_ecosystem_mongo_data
  qdrant_data:
    name: agentx_ecosystem_qdrant_data
  core_logs:
    name: agentx_ecosystem_core_logs
  benchmark_config:
    name: agentx_ecosystem_benchmark_config
  benchmark_logs:
    name: agentx_ecosystem_benchmark_logs
  rag_logs:
    name: agentx_ecosystem_rag_logs
