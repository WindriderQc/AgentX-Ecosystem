name: agentx-ecosystem

services:
  ollama:
    image: ollama/ollama:0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    container_name: agentx-ecosystem-ollama
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  core:
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_HOST_NAME: Docker Ollama
    depends_on:
      ollama:
        condition: service_healthy

  benchmark:
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_HOST_NAME: Docker Ollama
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
    name: agentx_ecosystem_ollama_data
