services:
  mongo:
    image: "${AGENTX_RECOVERY_DRILL_MONGODB_IMAGE:?set from config/container-image-pins.json}"
    restart: "no"
    command: ["mongod", "--bind_ip_all", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - mongodb_data:/data/db

  qdrant:
    image: "${AGENTX_RECOVERY_DRILL_QDRANT_IMAGE:?set from config/container-image-pins.json}"
    restart: "no"
    volumes:
      - qdrant_data:/qdrant/storage

  helper:
    image: "${AGENTX_RECOVERY_DRILL_HELPER_IMAGE:?set from config/container-image-pins.json}"
    restart: "no"
    command: ["sleep", "infinity"]
    depends_on:
      qdrant:
        condition: service_started

  core:
    image: "${AGENTX_RECOVERY_DRILL_CORE_IMAGE:?set an exact candidate image@sha256 reference}"
    restart: "no"
    tmpfs:
      - /tmp
      - /app/logs
      - /backups
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3080
      AGENTX_PROFILE: "${AGENTX_RECOVERY_DRILL_PRODUCT_PROFILE:-demo}"
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: http://127.0.0.1:9
      OLLAMA_HOST_NAME: Recovery drill unavailable fixture
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agentx_product_embeddings
      BENCHMARK_SERVICE_URL: http://benchmark:3081
      RAG_SERVICE_URL: http://rag:3082
      CORE_PUBLIC_URL: http://core:3080
      BENCHMARK_PUBLIC_URL: http://benchmark:3081
      RAG_PUBLIC_URL: http://rag:3082
      AGENTX_TRUST_INTERNAL_SERVICE_HOSTS: "true"
      AGENTX_TRUST_LOOPBACK_PROXY_UI: "false"
      BACKUP_DIR: /backups
      BACKUP_CONFIG_ROOT: /app/product-config
      BACKUP_SCHEDULE_ENABLED: "false"
      CORE_LEADER_LEASE_ENABLED: "false"
      WATCHDOG_INTERVAL_MS: "3600000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  benchmark:
    image: "${AGENTX_RECOVERY_DRILL_BENCHMARK_IMAGE:?set an exact candidate image@sha256 reference}"
    restart: "no"
    tmpfs:
      - /tmp
      - /app/logs
      - /app/config-data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3081
      AGENTX_PROFILE: "${AGENTX_RECOVERY_DRILL_PRODUCT_PROFILE:-demo}"
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: http://127.0.0.1:9
      OLLAMA_HOST_NAME: Recovery drill unavailable fixture
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      CORE_URL: http://core:3080
      CORE_PUBLIC_URL: http://core:3080
      BENCHMARK_PUBLIC_URL: http://benchmark:3081
      JUDGE_DEFAULTS_PATH: /app/config-data/judge-host-defaults.json
      AGENTX_TRUST_INTERNAL_SERVICE_HOSTS: "true"
      AGENTX_TRUST_LOOPBACK_PROXY_UI: "false"
      AGENTX_PLATFORM_EVENT_TOKEN: ""
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  rag:
    image: "${AGENTX_RECOVERY_DRILL_RAG_IMAGE:?set an exact candidate image@sha256 reference}"
    restart: "no"
    tmpfs:
      - /tmp
      - /app/logs
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3082
      AGENTX_PROFILE: "${AGENTX_RECOVERY_DRILL_PRODUCT_PROFILE:-demo}"
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      VECTOR_STORE_TYPE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agentx_product_embeddings
      EMBEDDING_PROVIDER: core-proxy
      EMBEDDING_MODEL: recovery-drill-unavailable
      EMBEDDING_DIMENSION: 4
      CORE_PROXY_URL: http://core:3080
      CORE_URL: http://core:3080
      AGENTX_TRUST_INTERNAL_SERVICE_HOSTS: "true"
      AGENTX_TRUST_LOOPBACK_PROXY_UI: "false"
      AGENTX_PLATFORM_EVENT_TOKEN: ""
      RAG_INGESTION_POLICY_PATH: /config/rag-ingestion-policy.json
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3082/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

networks:
  default:
    internal: true

volumes:
  mongodb_data: {}
  qdrant_data: {}
