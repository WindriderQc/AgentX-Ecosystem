services:
  mongo:
    image: ${AGENTX_UPGRADE_ROLLBACK_MONGO_IMAGE:?AGENTX_UPGRADE_ROLLBACK_MONGO_IMAGE must be an immutable digest reference}
    restart: "no"
    command: ["mongod", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo-data:/data/db
      - mongo-config-data:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    networks:
      - upgrade-rollback

  qdrant:
    image: ${AGENTX_UPGRADE_ROLLBACK_QDRANT_IMAGE:?AGENTX_UPGRADE_ROLLBACK_QDRANT_IMAGE must be an immutable digest reference}
    restart: "no"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - upgrade-rollback

  core:
    image: ${AGENTX_UPGRADE_ROLLBACK_CORE_IMAGE:?AGENTX_UPGRADE_ROLLBACK_CORE_IMAGE must be an immutable digest reference}
    restart: "no"
    tmpfs:
      - /tmp
      - /app/logs
      - /backups
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3080
      AGENTX_PROFILE: demo
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: http://127.0.0.1:9
      OLLAMA_HOST_NAME: Upgrade rollback unavailable fixture
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agentx_product_embeddings
      BENCHMARK_SERVICE_URL: http://benchmark:3081
      RAG_SERVICE_URL: http://rag:3082
      CORE_PUBLIC_URL: http://core:3080
      BENCHMARK_PUBLIC_URL: http://benchmark:3081
      RAG_PUBLIC_URL: http://rag:3082
      AGENTX_TRUST_INTERNAL_SERVICE_HOSTS: "true"
      AGENTX_TRUST_LOOPBACK_PROXY_UI: "false"
      BACKUP_DIR: /backups
      BACKUP_CONFIG_ROOT: /app/product-config
      BACKUP_SCHEDULE_ENABLED: "false"
      CORE_LEADER_LEASE_ENABLED: "false"
      WATCHDOG_INTERVAL_MS: "3600000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks:
      - upgrade-rollback

  benchmark:
    image: ${AGENTX_UPGRADE_ROLLBACK_BENCHMARK_IMAGE:?AGENTX_UPGRADE_ROLLBACK_BENCHMARK_IMAGE must be an immutable digest reference}
    restart: "no"
    tmpfs:
      - /tmp
      - /app/logs
      - /app/config-data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3081
      AGENTX_PROFILE: demo
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      OLLAMA_HOST: http://127.0.0.1:9
      OLLAMA_HOST_NAME: Upgrade rollback unavailable fixture
      OLLAMA_HOST_2: ""
      OLLAMA_HOST_2_NAME: ""
      OLLAMA_HOST_3: ""
      OLLAMA_HOST_3_NAME: ""
      CORE_URL: http://core:3080
      CORE_PUBLIC_URL: http://core:3080
      BENCHMARK_PUBLIC_URL: http://benchmark:3081
      JUDGE_DEFAULTS_PATH: /app/config-data/judge-host-defaults.json
      AGENTX_TRUST_INTERNAL_SERVICE_HOSTS: "true"
      AGENTX_TRUST_LOOPBACK_PROXY_UI: "false"
      AGENTX_PLATFORM_EVENT_TOKEN: ""
    depends_on:
      mongo:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks:
      - upgrade-rollback

  rag:
    image: ${AGENTX_UPGRADE_ROLLBACK_RAG_IMAGE:?AGENTX_UPGRADE_ROLLBACK_RAG_IMAGE must be an immutable digest reference}
    restart: "no"
    tmpfs:
      - /tmp
      - /app/logs
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3082
      AGENTX_PROFILE: demo
      MONGODB_URI: mongodb://mongo:27017/agentx_product
      VECTOR_STORE_TYPE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agentx_product_embeddings
      EMBEDDING_PROVIDER: core-proxy
      EMBEDDING_MODEL: upgrade-rollback-unavailable
      EMBEDDING_DIMENSION: 4
      CORE_PROXY_URL: http://core:3080
      CORE_URL: http://core:3080
      AGENTX_TRUST_INTERNAL_SERVICE_HOSTS: "true"
      AGENTX_TRUST_LOOPBACK_PROXY_UI: "false"
      AGENTX_PLATFORM_EVENT_TOKEN: ""
      RAG_INGESTION_POLICY_PATH: /config/rag-ingestion-policy.json
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
      core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3082/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    networks:
      - upgrade-rollback

volumes:
  mongo-data:
  mongo-config-data:
  qdrant-data:

networks:
  upgrade-rollback:
    internal: true
